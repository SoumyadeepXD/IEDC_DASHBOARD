<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IEDC CSE (AI &amp; ML) / CSE (AI) — Hall of Fame</title>
  <meta name="description"
    content="Cinematic Apple-keynote ambient TV display for IEDC CSE (AI & ML) / CSE (AI), IEM Kolkata.">

  <!-- Inter Font Preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>

<body>

  <!-- Animated Mesh Background Blobs & Film Grain Overlay -->
  <div class="mesh-background" id="mesh-background">
    <div class="mesh-blob blob-1"></div>
    <div class="mesh-blob blob-2"></div>
    <div class="mesh-blob blob-3"></div>
  </div>
  <div class="film-grain" aria-hidden="true"></div>

  <!-- Sparkles Canvas for Grand Champion Burst -->
  <canvas id="sparkles-canvas" class="sparkles-canvas"></canvas>

  <!-- TV Burn-in Protection Wrapper -->
  <div class="burn-in-wrapper" id="burn-in-wrapper">

    <!-- Quiet Apple TV Header Bar -->
    <header class="apple-header">
      <div class="apple-header-left">
        <span class="apple-mini-tag">IEDC CSE (AI &amp; ML) • IEM Kolkata</span>
      </div>
      <div class="apple-clock" id="apple-clock" aria-label="Current Time">12:00:00 PM</div>
    </header>

    <!-- Keynote Presentation Stage -->
    <main class="keynote-stage" id="keynote-stage" aria-live="polite">
      <!-- Slides dynamically built by js/tv-app.js -->
    </main>

    <!-- Bottom Apple Progress Pill Track -->
    <nav class="apple-dots-track" id="apple-dots-track" aria-label="Slideshow Controls"></nav>

    <!-- Auto-hiding Admin Gear Hotspot (Bottom-Right) -->
    <div class="admin-hotspot" id="admin-hotspot">
      <a href="admin.html" class="admin-hotspot-link" title="Open Admin Portal (press M)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/tv-app.js"></script>
</body>

</html>
